<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>Impressum – Shanty Chor Blaue Jungs Weilerswist 1996 e.V.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ──────────────────────────────────────────────── */
    :root {
      --navy:    #002147;
      --navy-lt: #003166;
      --gold:    #c8a96e;
      --bg:      #f4f6f9;
      --radius:  12px;
      --shadow:  0 2px 10px rgba(0,0,0,.10);
      --trans:   0.2s ease;
    }

    /* ── Reset / base ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      font-size: 1.05rem;
      background: var(--bg);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: var(--navy);
      color: #fff;
      padding: 2rem 1rem 0;
      text-align: center;
      overflow: hidden;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      letter-spacing: .03em;
    }

    .wave {
      display: block;
      width: calc(100% + 2rem);
      height: 48px;
      margin-top: 1rem;
      margin-left: -1rem;
    }

    /* ── Main ────────────────────────────────────────────────── */
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 1.5rem 5vw 3rem;
    }

    /* ── Back button ─────────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem 1.1rem;
      background: var(--navy);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .03em;
      transition: background var(--trans);
    }

    .back-btn:hover { background: var(--navy-lt); }

    /* ── PDF wrapper ─────────────────────────────────────────── */
    .pdf-wrapper {
      margin-top: 1.4rem;
      width: 100%;
      height: 90vh;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.08);
    }

    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

<header>
  <h1>Impressum</h1>
  <svg class="wave" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,24 C240,48 480,0 720,24 C960,48 1200,0 1440,24 L1440,48 L0,48 Z"
          fill="#f4f6f9"/>
  </svg>
</header>

<main>
  <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>

  <div class="pdf-wrapper">
    <iframe src="imprint.pdf" title="Impressum PDF"></iframe>
  </div>
</main>

</body>
</html>
