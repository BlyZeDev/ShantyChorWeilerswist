<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>Bildergalerie – Shanty Chor Blaue Jungs Weilerswist 1996 e.V.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --navy:    #002147;
      --navy-lt: #003166;
      --gold:    #c8a96e;
      --bg:      #f4f6f9;
      --card-bg: #ffffff;
      --text:    #1a1a2e;
      --muted:   #6b7280;
      --radius:  12px;
      --shadow:  0 2px 10px rgba(0,0,0,.10);
      --trans:   0.2s ease;
    }

    /* ── Reset / base ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      font-size: 1.05rem;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: var(--navy);
      color: #fff;
      padding: 2rem 1rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: .04em;
      position: relative;
      z-index: 1;
    }

    /* Nautical wave divider — the signature element */
    .wave {
      display: block;
      width: calc(100% + 2rem);
      height: 48px;
      margin-top: 1rem;
      margin-left: -1rem;
    }

    /* ── Main layout ─────────────────────────────────────────── */
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.5rem 5vw 3rem;
    }

    /* ── Back button ─────────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem 1.1rem;
      background: var(--navy);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .03em;
      transition: background var(--trans);
    }

    .back-btn:hover { background: var(--navy-lt); }

    /* ── Folder description ──────────────────────────────────── */
    #folderDescription {
      text-align: center;
      margin: 1.8rem auto 0;
      max-width: 860px;
    }

    #folderDescription h3 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--navy);
      margin-bottom: .8rem;
    }

    #folderDescription p {
      color: var(--text);
      line-height: 1.7;
      margin-top: .8rem;
    }

    /* Gold accent rule under title */
    #folderDescription h3::after {
      content: '';
      display: block;
      width: 48px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
      margin: .6rem auto 0;
    }

    /* ── Gallery grid ────────────────────────────────────────── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 2rem;
    }

    @media (max-width: 800px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .gallery { grid-template-columns: 1fr; } }

    /* ── Media card ──────────────────────────────────────────── */
    .media-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
      cursor: pointer;
      transition: transform var(--trans), box-shadow var(--trans);
      overflow: hidden;
    }

    .media-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,.14);
    }

    .media-item img,
    .media-item iframe {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    .media-item .caption {
      font-size: .88rem;
      color: #4b5563;
      margin-top: 7px;
      padding: 0 2px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-thumb {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-thumb img {
      width: 100%;
      display: block;
    }

    .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.28);
      transition: background var(--trans);
    }

    .play-icon::after {
      content: '';
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      display: flex;
      /* Triangle via clip-path on a pseudo */
      clip-path: none;
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
      /* Play triangle drawn with border trick */
      border-left: 20px solid var(--navy);
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      margin-left: 6px; /* optical centering of triangle */
  }

.media-item:hover .play-icon { background: rgba(0,0,0,.45); }

    /* ── Skeleton loading ────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, #e4e8f0 25%, #f0f2f7 50%, #e4e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
      aspect-ratio: 4/3;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Lightbox ────────────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    #lightbox.open { display: flex; }

    #lightbox-img {
      max-width: 95vw;
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      transform-origin: center center;
      border-radius: 4px;
    }

    #lightbox-vid {
      width: 95vw;
      height: 95vh;
      border: none;
    }

    /* Lightbox controls */
    .lb-btn {
      position: fixed;
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background var(--trans);
      user-select: none;
    }

    .lb-btn:hover { background: rgba(255,255,255,.22); }

    .lb-close {
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      font-size: 1.3rem;
    }

    .lb-prev,
    .lb-next {
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      font-size: 1.6rem;
    }

    .lb-prev { left:  max(12px, env(safe-area-inset-left));  }
    .lb-next { right: max(12px, env(safe-area-inset-right)); }

    @media (max-width: 768px) { .lb-prev, .lb-next { display: none !important; } }
  </style>
</head>

<body>

<header>
  <h1>Bildergalerie</h1>
  <!-- Signature wave — nautical nod, fills naturally at all widths -->
  <svg class="wave" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,24 C240,48 480,0 720,24 C960,48 1200,0 1440,24 L1440,48 L0,48 Z"
          fill="#f4f6f9"/>
  </svg>
</header>

<main>
  <a href="index.html" class="back-btn">← Zurück zur Startseite</a>

  <div id="folderDescription"></div>

  <div id="photoGallery" class="gallery">
    <!-- Skeleton placeholders shown while loading -->
    <div class="skeleton media-item"></div>
    <div class="skeleton media-item"></div>
    <div class="skeleton media-item"></div>
    <div class="skeleton media-item"></div>
    <div class="skeleton media-item"></div>
    <div class="skeleton media-item"></div>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true">
  <span class="lb-btn lb-close" id="lb-close" aria-label="Schließen">✕</span>
  <span class="lb-btn lb-prev"  id="lb-prev"  aria-label="Vorheriges">❮</span>
  <span class="lb-btn lb-next"  id="lb-next"  aria-label="Nächstes">❯</span>
  <img id="lightbox-img" style="display:none;" alt="">
  <iframe id="lightbox-vid" style="display:none;" allowfullscreen></iframe>
</div>

<script>
/* ── Config ──────────────────────────────────────────────────────── */
const API_KEY       = "AIzaSyDEcx7ykFSsLv2t-qegaNu4Uy540LpgDbQ";
const ROOT_FOLDER   = "1v4HNqreRXUlOIWu9Xy9q35hjQ299Cuv3";

/* ── State ───────────────────────────────────────────────────────── */
const folderStack = [ROOT_FOLDER];
let viewableFiles  = [];
let currentIndex   = 0;

let zoom  = 1, panX  = 0, panY  = 0;
let isDragging = false, isPinching = false;
let dragStartX = 0, dragStartY = 0;
let swipeStartX = 0, swipeStartY = 0;
let initialDistance = 0, initialZoom = 1;
let lastTap = 0;

/* ── DOM refs ────────────────────────────────────────────────────── */
const gallery    = document.getElementById("photoGallery");
const descBox    = document.getElementById("folderDescription");
const lightbox   = document.getElementById("lightbox");
const lbImg      = document.getElementById("lightbox-img");
const lbVid      = document.getElementById("lightbox-vid");
const lbClose    = document.getElementById("lb-close");
const lbPrev     = document.getElementById("lb-prev");
const lbNext     = document.getElementById("lb-next");

/* ── API helpers ─────────────────────────────────────────────────── */
async function driveJSON(url) {
  const res = await fetch(url);
  return res.json();
}

async function listFiles(folderId) {
  const q = `'${folderId}' in parents and trashed = false`;
  const url = `https://www.googleapis.com/drive/v3/files`
            + `?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType)&key=${API_KEY}`;
  const data = await driveJSON(url);
  return data.files || [];
}

async function getFileName(id) {
  const url = `https://www.googleapis.com/drive/v3/files/${id}?fields=name&key=${API_KEY}`;
  const data = await driveJSON(url);
  return data.name || "";
}

async function getFolderDescription(folderId) {
  const q = `'${folderId}' in parents and name = 'beschreibung.txt' and trashed = false`;
  const url = `https://www.googleapis.com/drive/v3/files`
            + `?q=${encodeURIComponent(q)}&fields=files(id)&key=${API_KEY}`;
  const data = await driveJSON(url);
  if (!data.files?.length) return "";
  const fileUrl = `https://www.googleapis.com/drive/v3/files/${data.files[0].id}?alt=media&key=${API_KEY}`;
  return fetch(fileUrl).then(r => r.text()).catch(() => "");
}

/* ── Utilities ───────────────────────────────────────────────────── */
const stripExt = name => name.replace(/\.[^/.]+$/, "");

function formatDescription(raw) {
  return raw
    .replace(/\r/g, "")
    .split("\n\n")
    .map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`)
    .join("");
}

/* ── Render ──────────────────────────────────────────────────────── */
async function renderFolder(folderId) {
  // Reset UI
  gallery.innerHTML = "";
  descBox.innerHTML = "";

  // Show skeletons while loading
  for (let i = 0; i < 6; i++) {
    const sk = document.createElement("div");
    sk.className = "skeleton media-item";
    gallery.appendChild(sk);
  }

  const [files, folderName, desc] = await Promise.all([
    listFiles(folderId),
    getFileName(folderId).then(stripExt),
    getFolderDescription(folderId),
  ]);

  viewableFiles = files.filter(
    f => f.mimeType !== "application/vnd.google-apps.folder" && f.name !== "beschreibung.txt"
  );

  // Description block
  descBox.innerHTML = `<h3>${folderName}</h3>`
    + (desc.trim() ? formatDescription(desc) : "");

  gallery.innerHTML = "";

  // Back button when inside a subfolder
  if (folderStack.length > 1) {
    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← Zurück";
    back.style.cssText = "border:none;cursor:pointer;grid-column:1/-1;justify-self:start;";
    back.onclick = () => { folderStack.pop(); renderFolder(folderStack.at(-1)); };
    gallery.appendChild(back);
  }

  for (const f of files) {
    if (f.name === "beschreibung.txt") continue;

    const card = document.createElement("div");
    card.className = "media-item";
    const name = stripExt(f.name);
    const showCaption = /\D/.test(name);
    const captionHTML = showCaption ? `<div class="caption">${name}</div>` : "";

    if (f.mimeType === "application/vnd.google-apps.folder") {
      card.innerHTML = `
        <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png"
             style="width:50%;display:block;margin:1rem auto;opacity:.75;" alt="Ordner">
        <div class="caption">${name}</div>`;
      card.onclick = () => { folderStack.push(f.id); renderFolder(f.id); };

    } else if (f.mimeType.startsWith("image/")) {
      card.innerHTML = `
        <img src="https://lh3.googleusercontent.com/d/${f.id}=w1000"
             loading="lazy" alt="${name}">
        ${captionHTML}`;
      card.onclick = () => openLightbox(f.id);

    } else if (f.mimeType.startsWith("video/") || f.name.endsWith(".mp4")) {
      card.innerHTML = `
        <div class="video-thumb">
          <img src="https://drive.google.com/thumbnail?id=${f.id}&sz=w1000"
              loading="lazy" alt="${name}">
          <div class="play-icon"></div>
        </div>
        ${captionHTML}`;
      card.onclick = () => openLightbox(f.id);
    }

    gallery.appendChild(card);
  }
}

/* ── Lightbox ────────────────────────────────────────────────────── */
function resetTransform() {
  zoom = 1; panX = 0; panY = 0;
  applyTransform();
}

function applyTransform() {
  const scaledW = lbImg.offsetWidth  * zoom;
  const scaledH = lbImg.offsetHeight * zoom;
  const maxX = Math.max(0, (scaledW - window.innerWidth)  / 2);
  const maxY = Math.max(0, (scaledH - window.innerHeight) / 2);
  panX = Math.min(maxX, Math.max(-maxX, panX));
  panY = Math.min(maxY, Math.max(-maxY, panY));
  lbImg.style.transform = `translate3d(${panX}px,${panY}px,0) scale(${zoom})`;
}

function openLightbox(id) {
  const f = viewableFiles.find(x => x.id === id);
  currentIndex = viewableFiles.indexOf(f);

  const multipleFiles = viewableFiles.length > 1;
  lbPrev.style.display = multipleFiles ? "" : "none";
  lbNext.style.display = multipleFiles ? "" : "none";

  if (f.mimeType.startsWith("image/")) {
    resetTransform();
    lbImg.onload = resetTransform;
    lbImg.src = `https://lh3.googleusercontent.com/d/${f.id}=w2400`;
    lbImg.style.display = "block";
    lbVid.style.display = "none";
  } else {
    lbVid.src = `https://drive.google.com/file/d/${f.id}/preview`;
    lbVid.style.display = "block";
    lbImg.style.display = "none";
  }

  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
  lbVid.src = "";
}

function navigate(dir) {
  currentIndex = (currentIndex + dir + viewableFiles.length) % viewableFiles.length;
  openLightbox(viewableFiles[currentIndex].id);
}

/* ── Lightbox event wiring ───────────────────────────────────────── */
lbClose.addEventListener("click",  e => { e.stopPropagation(); closeLightbox(); });
lbPrev.addEventListener ("click",  e => { e.stopPropagation(); navigate(-1); });
lbNext.addEventListener ("click",  e => { e.stopPropagation(); navigate(+1); });
lightbox.addEventListener("click", closeLightbox);
lbImg.addEventListener  ("click",  e => e.stopPropagation());
lbVid.addEventListener  ("click",  e => e.stopPropagation());

document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "Escape")       closeLightbox();
  if (e.key === "ArrowRight")   navigate(+1);
  if (e.key === "ArrowLeft")    navigate(-1);
});

/* Zoom – mouse wheel */
lbImg.addEventListener("wheel", e => {
  e.preventDefault();
  zoom *= e.deltaY < 0 ? 1.1 : 0.9;
  zoom  = Math.max(1, Math.min(10, zoom));
  applyTransform();
}, { passive: false });

/* Drag – mouse */
lbImg.addEventListener("mousedown", e => {
  e.preventDefault();
  if (zoom <= 1) return;
  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
  lbImg.style.cursor = "grabbing";
});

document.addEventListener("mousemove", e => {
  if (!isDragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  applyTransform();
});

document.addEventListener("mouseup", () => {
  isDragging = false;
  lbImg.style.cursor = "grab";
});

/* Double-click to reset zoom */
lbImg.addEventListener("dblclick", resetTransform);

/* Prevent browser drag ghost */
lbImg.addEventListener("dragstart", e => e.preventDefault());

/* ── Touch handling ──────────────────────────────────────────────── */
lbImg.addEventListener("touchstart", e => {
  // Two-finger pinch
  if (e.touches.length === 2) {
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialDistance = Math.hypot(dx, dy);
    initialZoom = zoom;
    return;
  }

  // Single-finger: record start for swipe + drag
  if (e.touches.length === 1) {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    if (zoom > 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX - panX;
      dragStartY = e.touches[0].clientY - panY;
    }
  }
}, { passive: true });

lbImg.addEventListener("touchmove", e => {
  if (e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    zoom = Math.max(1, Math.min(10, initialZoom * Math.hypot(dx, dy) / initialDistance));
    requestAnimationFrame(applyTransform);
    return;
  }

  if (isDragging && !isPinching) {
    e.preventDefault();
    panX = e.touches[0].clientX - dragStartX;
    panY = e.touches[0].clientY - dragStartY;
    requestAnimationFrame(applyTransform);
  }
}, { passive: false });

lbImg.addEventListener("touchend", e => {
  const wasPinching = isPinching;
  if (e.touches.length < 2) isPinching = false;
  isDragging = false;
  if (wasPinching) return;

  const touch = e.changedTouches[0];
  const dx = touch.clientX - swipeStartX;
  const dy = touch.clientY - swipeStartY;

  // Swipe to navigate (only when not zoomed)
  if (zoom === 1 && Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
    navigate(dx < 0 ? +1 : -1);
    return;
  }

  // Double-tap to reset zoom
  const now = Date.now();
  if (now - lastTap < 300) resetTransform();
  lastTap = now;
});

/* ── Boot ────────────────────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", () => renderFolder(ROOT_FOLDER));
</script>

</body>
</html>
