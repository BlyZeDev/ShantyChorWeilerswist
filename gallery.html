<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>Bildergalerie – Shanty Chor Blaue Jungs Weilerswist 1996 e.V.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #fafafa;
      text-align: center;
      scroll-behavior: smooth;
    }
    header {
      background: navy;
      color: white;
      padding: 1rem;
    }

    main {
      padding: 0 5vw;
    }
    section {
      padding: 2rem 0;
      max-width: 1200px;
      margin: auto;
    }
    h2 { color:#003366; }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1200px;
      margin: auto;
      padding: 2rem;
    }

    .media-item {
      width: calc(33% - 20px);
      max-width: 350px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      padding: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .media-item:hover {
      transform: scale(1.03);
    }

    .media-item img, .media-item iframe {
      width: 100%;
      border-radius: 8px;
    }

    @media(max-width:800px){ .media-item{ width:48%; } }
    @media(max-width:500px){ .media-item{ width:100%; } }
    @media (max-width: 768px) {
      .nav-arrow {
        display: none !important;
      }
    }

    .back-btn {
      display: inline-block;
      margin: 1rem;
      padding: 0.6rem 1.2rem;
      background:#003366;
      color:white;
      border-radius:8px;
      text-decoration:none;
    }

    #lightbox {
      touch-action: none;
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.95);
      z-index:9999;
      justify-content:center;
      align-items:center;
    }

    #lightbox-img {
      -webkit-user-drag: none;
      touch-action: none;
      max-width: 95vw;
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: grab;
      user-select: none;
      transform-origin: center center;
    }

    #lightbox-vid {
      width: 95vw;
      height: 95vh;
      border: none;
    }

    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10001;

      color: white;
      font-size: 3rem;
      cursor: pointer;

      width: 60px;
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,0.4);
      border-radius: 50%;

      user-select: none;
    }

    .nav-left {
      left: max(10px, env(safe-area-inset-left));
    }

    .nav-right {
      right: max(10px, env(safe-area-inset-right));
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10001;

      font-size: 2rem;
      color: white;
      cursor: pointer;

      background: rgba(0,0,0,0.4);
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
    }

    #folderDescription article {
      max-width: 900px;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    #folderDescription h3 {
      color: #003366;
      margin-bottom: 15px;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
    }

    #folderDescription p {
      margin: 16px 0;
    }

    .beschreibung-text {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Bildergalerie</h1>
</header>

<main>
  <a href="index.html" class="back-btn">← Zurück zur Startseite</a>

  <article class="beschreibung-text">
    <div id="folderDescription"></div>
  </article>

  <div id="photoGallery" class="gallery">Lade Inhalte…</div>

  <div id="lightbox">
    <span class="close-btn" onclick="closeLightbox(event)">✕</span>
    <span class="nav-arrow nav-left" onclick="prevItem(event)">❮</span>
    <span class="nav-arrow nav-right" onclick="nextItem(event)">❯</span>
    <img id="lightbox-img" style="display:none;">
    <iframe id="lightbox-vid" style="display:none;" allowfullscreen></iframe>
  </div>
</main>

<script>
const API_KEY = "AIzaSyDEcx7ykFSsLv2t-qegaNu4Uy540LpgDbQ";
const ROOT_FOLDER_ID = "1v4HNqreRXUlOIWu9Xy9q35hjQ299Cuv3";

let folderStack = [ROOT_FOLDER_ID];
let currentFiles = [];
let viewableFiles = [];
let currentIndex = 0;

let zoom = 1;
let panX = 0;
let panY = 0;
let isDragging = false;
let isPinching = false;
let dragStartX = 0;
let dragStartY = 0;
let swipeStartX = 0;
let swipeStartY = 0;

function removeExtension(name) {
  return name.replace(/\.[^/.]+$/, "");
}

async function listFiles(folderId) {
  const q = `'${folderId}' in parents and trashed = false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType)&key=${API_KEY}`;
  return (await fetch(url)).json().then(d => d.files || []);
}

async function getFolderDescription(folderId) {
  const query = `'${folderId}' in parents and name = 'beschreibung.txt' and trashed = false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();

  if (!data.files || data.files.length === 0) return ""; 

  const fileId = data.files[0].id;
  const textUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
  
  return fetch(textUrl).then(r => r.text()).catch(() => "");
}

async function renderFolder(folderId) {
  const gallery = document.getElementById("photoGallery");
  const descBox = document.getElementById("folderDescription");
  
  gallery.innerHTML = "Lade Inhalte…";
  descBox.innerHTML = "";

  const files = await listFiles(folderId);
  currentFiles = files;

  viewableFiles = files.filter(f => 
    f.mimeType !== "application/vnd.google-apps.folder" &&
    f.name !== "beschreibung.txt"
  );

  gallery.innerHTML = "";

  const folderName = removeExtension(await getFolderName(folderId));
  let descriptionHTML = `<article><h3>${folderName}</h3>`;

  const desc = await getFolderDescription(folderId);
  if (desc.trim() !== "") {
    const formatted = desc
      .replace(/\r/g, "")
      .split("\n\n")
      .map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`)
      .join("");
    descriptionHTML += formatted;
  }

  descriptionHTML += `</article>`;
  descBox.innerHTML = descriptionHTML;

  if (folderStack.length > 1) {
    const back = document.createElement("a");
    back.className = "back-btn";
    back.textContent = "← Zurück";
    back.onclick = () => { folderStack.pop(); renderFolder(folderStack.at(-1)); };
    gallery.appendChild(back);
  }

  for (let f of files) {
    if (f.name === "beschreibung.txt") continue;

    const div = document.createElement("div");
    div.className = "media-item";
    const name = removeExtension(f.name);

    const showCaption = /\D/.test(name);

    if (f.mimeType === "application/vnd.google-apps.folder") {
      div.innerHTML = `
        <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" style="width:60%;opacity:0.8;">
        <div class="caption">${name}</div>`;
      div.onclick = () => { folderStack.push(f.id); renderFolder(f.id); };
    } 
    else if (f.mimeType.startsWith("image/")) {
      div.innerHTML = `
        <img src="https://lh3.googleusercontent.com/d/${f.id}=w1000">
        ${showCaption ? `<div class="caption">${name}</div>` : ''}`;
      div.onclick = () => openLightbox(f.id);
    } 
    else if (f.mimeType.startsWith("video/") || f.name.endsWith(".mp4")) {
      div.innerHTML = `
        <iframe src="https://drive.google.com/file/d/${f.id}/preview"></iframe>
        ${showCaption ? `<div class="caption">${name}</div>` : ''}`;
      div.onclick = () => openLightbox(f.id);
    }

    gallery.appendChild(div);
  }
}

async function getFolderName(id) {
  const url = `https://www.googleapis.com/drive/v3/files/${id}?fields=name&key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.name || "";
}

function openLightbox(id) {
  document.body.style.overflow = "hidden";

  const arrows = document.querySelectorAll(".nav-arrow");

  if (viewableFiles.length <= 1) {
    arrows.forEach(x => x.style.display = "none");
  } else {
    arrows.forEach(x => x.style.display = "");
  }

  const f = viewableFiles.find(x => x.id === id);
  currentIndex = viewableFiles.indexOf(f);

  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  const vid = document.getElementById("lightbox-vid");

  if (f.mimeType.startsWith("image/")) {
    zoom = 1;
    panX = 0;
    panY = 0;

    img.src = `https://lh3.googleusercontent.com/d/${f.id}=w2400`;
    img.style.display = "block";
    vid.style.display = "none";

    updateImageTransform();
  } else {
    vid.src = `https://drive.google.com/file/d/${f.id}/preview`;
    vid.style.display = "block";
    img.style.display = "none";
  }

  lb.style.display = "flex";
}

function updateImageTransform() {
  const img = document.getElementById("lightbox-img");
  img.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoom})`;
}

function closeLightbox(e) {
  e.stopPropagation();

  document.body.style.overflow = "";

  document.getElementById("lightbox").style.display = "none";
  document.getElementById("lightbox-vid").src = "";
}

function nextItem(e) {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % viewableFiles.length;
  openLightbox(viewableFiles[currentIndex].id);
}

function prevItem(e) {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + viewableFiles.length) % viewableFiles.length;
  openLightbox(viewableFiles[currentIndex].id);
}

document.getElementById("lightbox").addEventListener("click", closeLightbox);

document.addEventListener("DOMContentLoaded", () => {
  renderFolder(ROOT_FOLDER_ID);
});

const lightboxImg = document.getElementById("lightbox-img");

lightboxImg.addEventListener("wheel", e => {
  e.preventDefault();

  const factor = e.deltaY < 0 ? 1.1 : 0.9;

  zoom *= factor;
  zoom = Math.max(1, Math.min(zoom, 10));

  updateImageTransform();
});

lightboxImg.addEventListener("mousedown", e => {
  e.preventDefault();

  if (zoom <= 1) return;

  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;

  lightboxImg.style.cursor = "grabbing";
});

document.addEventListener("mousemove", e => {
  if (!isDragging) return;

  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;

  updateImageTransform();
});

document.addEventListener("mouseup", () => {
  isDragging = false;
  lightboxImg.style.cursor = "grab";
});

lightboxImg.addEventListener("click", e => {
  e.stopPropagation();
});

document.getElementById("lightbox-vid").addEventListener("click", e => {
  e.stopPropagation();
});

lightboxImg.addEventListener("dblclick", () => {
  zoom = 1;
  panX = 0;
  panY = 0;
  updateImageTransform();
});

lightboxImg.addEventListener("touchstart", e => {
  if (e.touches.length !== 1)
    return;

  if (zoom <= 1)
    return;

  const touch = e.touches[0];

  isDragging = true;
  dragStartX = touch.clientX - panX;
  dragStartY = touch.clientY - panY;
});

lightboxImg.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;

  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
});

lightboxImg.addEventListener("touchmove", e => {
  if (isPinching) return;
  if (!isDragging) return;

  e.preventDefault();

  const touch = e.touches[0];

  panX = touch.clientX - dragStartX;
  panY = touch.clientY - dragStartY;

  updateImageTransform();
}, { passive: false });

lightboxImg.addEventListener("touchend", () => {
  isDragging = false;
});

let lastTap = 0;

lightboxImg.addEventListener("touchend", e => {

  const wasPinching = isPinching;

  if (e.touches.length < 2) {
    isPinching = false;
  }

  isDragging = false;

  if (wasPinching)
    return;

  const touch = e.changedTouches[0];

  const dx = touch.clientX - swipeStartX;
  const dy = touch.clientY - swipeStartY;

  if (
    zoom === 1 &&
    Math.abs(dx) > 80 &&
    Math.abs(dx) > Math.abs(dy)
  ) {
    if (dx < 0)
      nextItem({ stopPropagation(){} });
    else
      prevItem({ stopPropagation(){} });

    return;
  }

  const now = Date.now();

  if (now - lastTap < 300) {
    zoom = 1;
    panX = 0;
    panY = 0;
    updateImageTransform();
  }

  lastTap = now;
});

let initialDistance = 0;
let initialZoom = 1;

lightboxImg.addEventListener("touchstart", e => {
  if (e.touches.length !== 2) return;

  isPinching = true;

  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;

  initialDistance = Math.hypot(dx, dy);
  initialZoom = zoom;
});

lightboxImg.addEventListener("touchmove", e => {
  if (e.touches.length !== 2) return;

  e.preventDefault();

  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;

  const distance = Math.hypot(dx, dy);

  zoom = initialZoom * (distance / initialDistance);
  zoom = Math.max(1, Math.min(zoom, 10));

  updateImageTransform();
}, { passive: false });

lightboxImg.addEventListener("dragstart", e => {
  e.preventDefault();
});
</script>

</body>
</html>
